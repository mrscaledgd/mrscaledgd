[project]
name = "tubal"
version = "0.1.0"
description = "Preconditioned factored algorithms for transformed low-tubal-rank tensor estimation"
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tubal"]

[tool.pytest.ini_options]
testpaths = ["tests"]
